<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Signal OptiSense – Login</title>
<style>
/* System fonts fallback */

:root {
  --bg: #050d12;
  --surf: #0b1a22;
  --bdr: #0e3347;
  --acc: #00c2ff;
  --grn: #00e87a;
  --yel: #ffc22a;
  --red: #ff3e5e;
  --txt: #cde8f5;
  --mut: #4a7a94;
  --emg: #ff5500;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Animated grid background */
.grid-bg {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,194,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,194,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
  0% { transform: perspective(500px) rotateX(10deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(10deg) translateY(40px); }
}

/* Scan line effect */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.05) 2px,
    rgba(0,0,0,0.05) 4px
  );
  pointer-events: none;
  z-index: 100;
}

/* Corner decorations */
.corner {
  position: fixed;
  width: 80px;
  height: 80px;
  opacity: 0.4;
}
.corner.tl { top: 20px; left: 20px; border-top: 2px solid var(--acc); border-left: 2px solid var(--acc); }
.corner.tr { top: 20px; right: 20px; border-top: 2px solid var(--acc); border-right: 2px solid var(--acc); }
.corner.bl { bottom: 20px; left: 20px; border-bottom: 2px solid var(--acc); border-left: 2px solid var(--acc); }
.corner.br { bottom: 20px; right: 20px; border-bottom: 2px solid var(--acc); border-right: 2px solid var(--acc); }

/* Glowing orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  animation: orbPulse 4s ease-in-out infinite;
}
.orb1 { width: 300px; height: 300px; background: rgba(0,194,255,0.07); top: -100px; left: -100px; }
.orb2 { width: 200px; height: 200px; background: rgba(0,232,122,0.05); bottom: -50px; right: -50px; animation-delay: 2s; }
@keyframes orbPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Main container */
.container {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 420px;
  padding: 20px;
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* Logo section */
.logo-section {
  text-align: center;
  margin-bottom: 32px;
}

.logo-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 16px;
  position: relative;
}

.logo-icon svg {
  width: 100%;
  height: 100%;
}

.logo-ring {
  animation: spin 6s linear infinite;
  transform-origin: center;
}
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--acc);
  text-transform: uppercase;
}

.brand-sub {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--mut);
  margin-top: 4px;
  font-family: 'Courier New', monospace;
}

/* Card */
.card {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-top: 2px solid var(--acc);
  border-radius: 4px;
  padding: 32px 28px;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--acc), transparent);
  animation: scanLine 3s linear infinite;
}
@keyframes scanLine { 0%{left:-60%} 100%{left:100%} }

.card-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--mut);
  text-transform: uppercase;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: '';
  width: 14px;
  height: 2px;
  background: var(--acc);
}

/* Form */
.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--mut);
  text-transform: uppercase;
  margin-bottom: 7px;
}

.input-wrap {
  position: relative;
}

.input-wrap .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mut);
  font-size: 14px;
  pointer-events: none;
}

input {
  width: 100%;
  background: #061018;
  border: 1px solid var(--bdr);
  color: var(--txt);
  font-family: 'Courier New', monospace;
  font-size: 14px;
  padding: 11px 12px 11px 38px;
  border-radius: 3px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  letter-spacing: 1px;
}

input:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(0,194,255,0.1);
}

input::placeholder { color: var(--mut); opacity: 0.5; }

.toggle-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--mut);
  cursor: pointer;
  font-size: 14px;
  transition: color 0.2s;
}
.toggle-pass:hover { color: var(--acc); }

/* Error message */
.error-msg {
  background: rgba(255,62,94,0.1);
  border: 1px solid rgba(255,62,94,0.3);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 9px 12px;
  border-radius: 3px;
  margin-bottom: 16px;
  display: none;
  animation: shake 0.3s ease;
}
.error-msg.show { display: block; }
@keyframes shake {
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

/* Submit button */
.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--acc);
  color: #001a20;
  border: none;
  border-radius: 3px;
  font-family: 'Segoe UI', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.btn-login::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.1);
  transform: translateX(-100%);
  transition: transform 0.3s;
}
.btn-login:hover::after { transform: translateX(0); }
.btn-login:hover { box-shadow: 0 0 20px rgba(0,194,255,0.4); }
.btn-login:active { transform: scale(0.98); }

.btn-login.loading {
  opacity: 0.7;
  cursor: not-allowed;
  pointer-events: none;
}

/* Demo users hint */
.hint-section {
  margin-top: 24px;
  border-top: 1px solid var(--bdr);
  padding-top: 20px;
}

.hint-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--mut);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.user-pills {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  background: #061018;
  border: 1px solid var(--bdr);
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.user-pill:hover {
  border-color: var(--acc);
  background: rgba(0,194,255,0.05);
}

.pill-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,194,255,0.15);
  border: 1px solid rgba(0,194,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  color: var(--acc);
  font-family: 'Courier New', monospace;
  flex-shrink: 0;
}

.pill-info { flex: 1; }
.pill-name { font-size: 12px; font-weight: 600; color: var(--txt); }
.pill-cred { font-family: 'Courier New', monospace; font-size: 10px; color: var(--mut); margin-top: 1px; }

.pill-role {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 3px 7px;
  border-radius: 2px;
  text-transform: uppercase;
}
.role-admin { background: rgba(255,194,42,0.15); color: var(--yel); border: 1px solid rgba(255,194,42,0.3); }
.role-op    { background: rgba(0,232,122,0.12); color: var(--grn); border: 1px solid rgba(0,232,122,0.25); }
.role-view  { background: rgba(0,194,255,0.1); color: var(--acc); border: 1px solid rgba(0,194,255,0.2); }

/* Footer */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 10px;
  color: var(--mut);
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
}

/* Loading overlay */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.loading-overlay.show { opacity: 1; pointer-events: all; }

.loading-text {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: var(--acc);
  letter-spacing: 3px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.loading-bar-wrap {
  width: 200px;
  height: 2px;
  background: var(--bdr);
  border-radius: 1px;
  overflow: hidden;
}
.loading-bar {
  height: 100%;
  background: var(--acc);
  border-radius: 1px;
  animation: loadBar 1.2s ease-in-out forwards;
}
@keyframes loadBar { from{width:0} to{width:100%} }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-text" id="loadingText">AUTHENTICATING...</div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
</div>

<div class="container">
  <!-- Logo -->
  <div class="logo-section">
    <div class="logo-icon">
      <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer ring -->
        <circle cx="35" cy="35" r="32" fill="none" stroke="rgba(0,194,255,0.15)" stroke-width="1"/>
        <!-- Rotating dashed ring -->
        <circle cx="35" cy="35" r="28" fill="none" stroke="rgba(0,194,255,0.4)" stroke-width="1.5"
          stroke-dasharray="6 4" class="logo-ring"/>
        <!-- Tick marks -->
        <line x1="35" y1="3" x2="35" y2="8" stroke="#00c2ff" stroke-width="2" opacity="0.8"/>
        <line x1="35" y1="62" x2="35" y2="67" stroke="#00c2ff" stroke-width="2" opacity="0.8"/>
        <line x1="3" y1="35" x2="8" y2="35" stroke="#00c2ff" stroke-width="2" opacity="0.8"/>
        <line x1="62" y1="35" x2="67" y2="35" stroke="#00c2ff" stroke-width="2" opacity="0.8"/>
        <!-- Inner hex -->
        <polygon points="35,18 47,26 47,44 35,52 23,44 23,26"
          fill="rgba(0,194,255,0.06)" stroke="rgba(0,194,255,0.3)" stroke-width="1"/>
        <!-- Traffic light icon -->
        <rect x="30" y="22" width="10" height="26" rx="2" fill="rgba(0,194,255,0.08)" stroke="rgba(0,194,255,0.3)" stroke-width="1"/>
        <circle cx="35" cy="27" r="3" fill="#ff3e5e"/>
        <circle cx="35" cy="35" r="3" fill="#ffc22a"/>
        <circle cx="35" cy="43" r="3" fill="#00e87a"/>
        <!-- Glow -->
        <circle cx="35" cy="43" r="4" fill="none" stroke="rgba(0,232,122,0.4)" stroke-width="1"/>
      </svg>
    </div>
    <div class="brand-name">AI Signal OptiSense</div>
    <div class="brand-sub">TRAFFIC CONTROL SYSTEM v2.4</div>
  </div>

  <!-- Login card -->
  <div class="card">
    <div class="card-title">Operator Login</div>

    <div class="error-msg" id="errorMsg">⚠ Invalid username or password</div>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <span class="icon">▶</span>
        <input type="text" id="username" placeholder="enter username" autocomplete="username" />
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="enter password" autocomplete="current-password" id="passInput"/>
        <button class="toggle-pass" id="togglePass" type="button" title="Show/Hide">👁</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      ► ACCESS SYSTEM
    </button>

    <!-- Quick login hints -->
    <div class="hint-section">
      <div class="hint-title">Quick Access — Click to fill</div>
      <div class="user-pills" id="userPills">
        <!-- Populated by JS from users.json -->
      </div>
    </div>
  </div>

  <div class="footer">SECURE LOCAL SYSTEM &nbsp;|&nbsp; NO EXTERNAL CONNECTION</div>
</div>

<script>
// ─── Users ────────────────────────────────────────────────────────────────────
let USERS = [
  { id:1, username:'admin',    password:'admin123', role:'Administrator',    name:'Admin User',    avatar:'AU' },
  { id:2, username:'operator', password:'op2024',   role:'Traffic Operator', name:'Operator One',  avatar:'O1' },
  { id:3, username:'viewer',   password:'view123',  role:'Viewer',           name:'Guest Viewer',  avatar:'GV' }
];

function loadUsers() {
  renderPills();
}

function roleClass(role) {
  if (role.toLowerCase().includes('admin'))    return 'role-admin';
  if (role.toLowerCase().includes('operator')) return 'role-op';
  return 'role-view';
}

function renderPills() {
  const wrap = document.getElementById('userPills');
  wrap.innerHTML = USERS.map(u => `
    <div class="user-pill" onclick="fillCreds('${u.username}','${u.password}')">
      <div class="pill-avatar">${u.avatar}</div>
      <div class="pill-info">
        <div class="pill-name">${u.name}</div>
        <div class="pill-cred">${u.username} / ${u.password}</div>
      </div>
      <div class="pill-role ${roleClass(u.role)}">${u.role}</div>
    </div>
  `).join('');
}

function fillCreds(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('errorMsg').classList.remove('show');
}

// ─── Toggle password visibility ───────────────────────────────────────────────
document.getElementById('togglePass').addEventListener('click', () => {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

// ─── Login logic ──────────────────────────────────────────────────────────────
function doLogin() {
  const uname = document.getElementById('username').value.trim();
  const pass  = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  const btn   = document.getElementById('loginBtn');

  errEl.classList.remove('show');

  if (!uname || !pass) {
    errEl.textContent = '⚠ Please enter username and password';
    errEl.classList.add('show');
    return;
  }

  const user = USERS.find(u => u.username === uname && u.password === pass);

  if (!user) {
    errEl.textContent = '⚠ Invalid username or password';
    errEl.classList.add('show');
    document.getElementById('password').value = '';
    return;
  }

  // Success → save session & redirect
  sessionStorage.setItem('ais_user', JSON.stringify({
    id:       user.id,
    name:     user.name,
    role:     user.role,
    avatar:   user.avatar,
    username: user.username,
    loginAt:  new Date().toISOString()
  }));

  // Show loading overlay
  const overlay = document.getElementById('loadingOverlay');
  const loadTxt = document.getElementById('loadingText');
  overlay.classList.add('show');
  btn.classList.add('loading');

  const msgs = ['AUTHENTICATING...', 'VERIFYING CLEARANCE...', 'LOADING DASHBOARD...'];
  let i = 0;
  const iv = setInterval(() => { if (++i < msgs.length) loadTxt.textContent = msgs[i]; }, 400);

  setTimeout(() => {
    clearInterval(iv);
    window.location.href = '/live_dashboard.html';
  }, 1300);
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
loadUsers();
</script>
</body>
</html>
